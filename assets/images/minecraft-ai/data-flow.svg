<svg xmlns="http://www.w3.org/2000/svg" width="560" height="830" viewBox="0 0 560 830" role="img" aria-labelledby="title desc">
  <title id="title">관측 데이터 수집 설계</title>
  <desc id="desc">실행 ID와 에피소드, 스텝 및 시간 기준을 공유한다. 행동 로그와 영상은 별도 파일로 저장하고 시각 오프셋으로 연결하며, 이후 분석과 대시보드에서 조회한다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#406679"/></marker></defs>
  <rect width="560" height="830" rx="18" fill="#f5f8fa"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#243844">
    <text x="280" y="40" font-size="23" font-weight="700">관측 · 기록 흐름 설계</text>
    <text x="280" y="70" font-size="17">실제 수집 결과가 아닌 계획</text>
    <g stroke="#71909c" stroke-width="2" fill="#fff">
      <rect x="45" y="100" width="470" height="100" rx="12"/>
      <rect x="45" y="260" width="470" height="100" rx="12"/>
      <rect x="45" y="420" width="470" height="100" rx="12"/>
      <rect x="45" y="580" width="470" height="90" rx="12"/>
      <rect x="45" y="730" width="470" height="65" rx="12" stroke-dasharray="6 4"/>
    </g>
    <g font-size="21" font-weight="700">
      <text x="280" y="137">실행 세션 · 공통 식별자</text>
      <text x="280" y="297">행동 로그 + 관찰 영상</text>
      <text x="280" y="457">동기화 메타데이터</text>
      <text x="280" y="615">원본 보존 + 요약 · 검색</text>
      <text x="280" y="770">평가 · 대시보드 (후속 검토)</text>
    </g>
    <g font-size="17">
      <text x="280" y="168">Run ID / Episode ID / Step ID</text>
      <text x="280" y="239">UTC 시각 + 실행 경과 시간</text>
      <text x="280" y="328">어댑터 이벤트 / OBS·FFmpeg 후보</text>
      <text x="280" y="399">독립된 기록을 같은 시간축으로 연결</text>
      <text x="280" y="488">영상 PTS · 오프셋 · 오차 · 구간 ID</text>
      <text x="280" y="559">누락과 시간 드리프트도 기록</text>
      <text x="280" y="646">JSONL·영상 / CSV·SQLite·Parquet 후보</text>
      <text x="280" y="709">보상 그래프에서 해당 영상으로 이동</text>
    </g>
  </g>
  <g fill="none" stroke="#406679" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M65 206V254"/><path d="M65 366V414"/><path d="M65 526V574"/><path d="M65 676V724"/>
  </g>
</svg>
