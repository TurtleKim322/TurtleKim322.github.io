<script type="application/ld+json">
{% if page.date %}
{
  "@context": "https://schema.org", "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | markdownify | strip_html | normalize_whitespace | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "author": {"@type": "Person", "name": {{ author.name | default: site.author.name | jsonify }}},
  "url": {{ canonical_url | jsonify }},
  "mainEntityOfPage": {{ canonical_url | jsonify }}
}
{% else %}
{
  "@context": "https://schema.org", "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }}
}
{% endif %}
</script>
