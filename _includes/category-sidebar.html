<div class="category-sidebar" data-category-sidebar>
  <button class="category-sidebar__toggle" type="button" aria-expanded="false" aria-controls="category-sidebar-menu" hidden>☰ 카테고리</button>
  <nav id="category-sidebar-menu" class="category-sidebar__menu" aria-label="카테고리">
    <h2 class="category-sidebar__title">카테고리</h2>
    <a class="category-sidebar__all" href="{{ '/categories/' | relative_url }}">카테고리 전체보기</a>
    <ul class="category-sidebar__list">
      {% for category in site.data.categories.categories %}
        {% include category-sidebar-node.html category=category %}
      {% endfor %}
    </ul>
  </nav>
</div>
<script src="{{ '/assets/js/category-sidebar.js' | relative_url }}" defer></script>
